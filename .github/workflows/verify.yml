name: Vérification Formelle & Numérique

on: [push, pull_request]

jobs:
  verify-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test du moteur Python universel V_r
        run: python3 src/vr_universal_engine.py

      - name: Téléchargement et vérification Lean 4
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download -R leanprover/lean4 -p "*linux.tar.zst"
          tar --zstd -xf lean-*-linux.tar.zst
          ./lean-*-linux/bin/lean proofs/PrimorialTowerDraft.lean
