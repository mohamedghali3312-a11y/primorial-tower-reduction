name: Vérification Formelle & Numérique

on: [push, pull_request]

jobs:
  verify-all:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Test du moteur Python universel V_r
        run: python3 src/vr_universal_engine.py

      - name: Installation et vérification Lean 4
        run: |
          curl https://githubusercontent.com -sSf | sh -s -- -y --default-toolchain leanprover/lean4:stable
          ~/.elan/bin/lean proofs/PrimorialTowerDraft.lean
