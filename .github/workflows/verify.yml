name: Vérification Formelle & Numérique

on: [push, pull_request]

jobs:
  verify-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test Python V_r
        run: python3 src/vr_universal_engine.py
      - name: Test Lean 4
        uses: leanprover/lean-action@v1
        with:
          build-args: proofs/PrimorialTowerDraft.lean
